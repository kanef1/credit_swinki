services:
  postgres:
    image: postgres:16-alpine
    container_name: credit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: alfa
      POSTGRES_PASSWORD: alfapass
      POSTGRES_DB: credit_conveyor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfa -d credit_conveyor"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: credit_backend
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      - DATABASE_URL=postgres://alfa:alfapass@postgres:5432/credit_conveyor?sslmode=disable
      - PORT=8080
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: credit_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
